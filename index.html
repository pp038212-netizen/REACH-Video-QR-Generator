<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REACH Video QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
  header { background: #17365d; color: #fff; padding: 28px 34px; }
  header h1 { margin: 0 0 7px; font-size: 28px; }
  header p { margin: 0; opacity: .9; }
  main { max-width: 1050px; margin: 24px auto 70px; padding: 0 18px; }
  .toolbar {
    position: sticky; top: 0; z-index: 5; background: #fff; padding: 15px;
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.12); margin-bottom: 20px;
  }
  .search {
    width: 100%; padding: 12px; border: 1px solid #ccd1d8; border-radius: 7px;
    font-size: 15px; margin-bottom: 12px;
  }
  .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  button {
    padding: 10px 16px; border: 0; border-radius: 7px; font-weight: bold;
    cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .primary { background: #17365d; color: #fff; }
  .primary:hover { background: #1f487a; }
  .secondary { background: #e5e8ec; color: #222; }
  .secondary:hover { background: #d6dbe1; }
  .count { font-weight: bold; margin-left: 6px; }
  .status-msg { font-size: 13px; color: #17365d; font-weight: 600; margin-left: 8px; }
  .category {
    background: #fff; border-radius: 10px; margin-bottom: 18px;
    overflow: hidden; box-shadow: 0 1px 5px rgba(0,0,0,.08);
  }
  .category-header {
    display: flex; align-items: center; justify-content: flex-start; gap: 12px;
    padding: 12px 17px; background: #e9edf2;
  }
  .category-header h2 { margin: 0; font-size: 18px; }
  .cat-select-btn {
    background: #fff; color: #17365d; border: 1px solid #cbd2d9;
    padding: 5px 11px; font-size: 12px; border-radius: 6px; margin-right: 0;
  }
  .cat-select-btn:hover { background: #17365d; color: #fff; border-color: #17365d; }
  .video {
    display: flex; align-items: center; gap: 12px; padding: 13px 17px;
    border-top: 1px solid #eee; cursor: pointer;
  }
  .video:hover { background: #fafafa; }
  .video input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .title { font-weight: 600; flex: 1; }
  .remove-btn {
    background: transparent; color: #b91c1c; padding: 4px 8px; font-size: 12px;
  }
  .remove-btn:hover { background: #fee2e2; }
  .custom-box {
    background: #fff; border-radius: 10px; padding: 16px 17px; margin-bottom: 18px;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
  }
  .custom-box h3 { margin: 0 0 10px; font-size: 16px; color: #17365d; }
  .custom-inputs { display: flex; flex-wrap: wrap; gap: 8px; }
  .custom-inputs input {
    flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccd1d8;
    border-radius: 7px; font-size: 14px;
  }
  #qr-staging { position: absolute; left: -9999px; top: -9999px; }
</style>
</head>
<body>
<header>
  <h1>REACH Educational Video QR Generator</h1>
  <p>Select videos and create a print-ready PDF of QR codes.</p>
</header>

<main>
  <div class="toolbar">
    <input id="search" class="search" placeholder="Search videos...">
    <div class="btn-row">
      <button type="button" class="secondary" onclick="selectAll()">Select All</button>
      <button type="button" class="secondary" onclick="clearAll()">Clear All</button>
      <button type="button" class="secondary" onclick="copyShareLink()">Copy Link to Selection</button>
      <button type="button" id="gen-btn" class="primary" onclick="generatePDF()">Generate QR Code PDF</button>
      <span class="count"><span id="count">0</span> selected</span>
      <span id="status" class="status-msg"></span>
    </div>
  </div>

  <div class="custom-box">
    <h3>+ Add Custom Video to This PDF</h3>
    <div class="custom-inputs">
      <input id="custom-title" placeholder="Title (e.g., PT - Custom Balance Drill)">
      <input id="custom-url" placeholder="Video URL (https://...)">
      <button type="button" class="secondary" onclick="addCustomVideo()">Add Video</button>
    </div>
  </div>

  <div id="catalog">Loading videos...</div>
</main>

<div id="qr-staging"></div>
