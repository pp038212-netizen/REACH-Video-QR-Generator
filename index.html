<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>REACH Video QR Generator</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#17365d;color:#fff;padding:28px 34px}
header h1{margin:0 0 7px;font-size:28px} header p{margin:0;opacity:.9}
main{max-width:1050px;margin:24px auto 70px;padding:0 18px}
.toolbar{position:sticky;top:0;z-index:5;background:#fff;padding:15px;border-radius:10px;
box-shadow:0 2px 12px rgba(0,0,0,.12);margin-bottom:20px}
.search{width:100%;padding:12px;border:1px solid #ccd1d8;border-radius:7px;font-size:15px;margin-bottom:12px}
button{padding:10px 16px;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin-right:7px}
.primary{background:#17365d;color:#fff}.secondary{background:#e5e8ec}.count{font-weight:bold;margin-left:5px}
.category{background:#fff;border-radius:10px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.category h2{margin:0;padding:14px 17px;background:#e9edf2;font-size:18px}
.video{display:flex;align-items:center;gap:12px;padding:13px 17px;border-top:1px solid #eee;cursor:pointer}
.video:hover{background:#fafafa}.video input{width:18px;height:18px}.title{font-weight:600}
</style>
</head>
<body>
<header><h1>REACH Educational Video QR Generator</h1>
<p>Select videos and create a print-ready PDF of QR codes.</p></header>
<main><form id="form" method="post" action="/generate">
<div class="toolbar">
<input id="search" class="search" placeholder="Search videos...">
<button type="button" class="secondary" onclick="selectAll()">Select All</button>
<button type="button" class="secondary" onclick="clearAll()">Clear All</button>
<button type="button" class="primary" onclick="generate()">Generate QR Code PDF</button>
<span class="count"><span id="count">0</span> selected</span>
</div>
{% for category, vids in categories.items() %}
<section class="category"><h2>{{category}}</h2>
{% for v in vids %}
<label class="video" data-search="{{(v.title+' '+v.category)|lower}}">
<input type="checkbox" name="video_ids" value="{{v.id}}" onchange="update()">
<span class="title">{{v.title}}</span></label>
{% endfor %}</section>
{% endfor %}
</form></main>
<script>
const boxes=()=>[...document.querySelectorAll('input[name="video_ids"]')];
function update(){document.getElementById('count').textContent=boxes().filter(x=>x.checked).length}
function selectAll(){boxes().forEach(x=>x.checked=true);update()}
function clearAll(){boxes().forEach(x=>x.checked=false);update()}
function generate(){if(!boxes().some(x=>x.checked)){alert('Please select at least one video.');return}document.getElementById('form').submit()}
document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();document.querySelectorAll('.video').forEach(v=>v.style.display=v.dataset.search.includes(q)?'flex':'none')})
</script>
</body></html>
